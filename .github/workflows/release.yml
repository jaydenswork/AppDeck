name: Build and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = (Get-Content -Raw -LiteralPath .\VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $env:REF_NAME" }
            $tagVersion = $env:REF_NAME.Substring(1)
            if ($tagVersion -ne $version) { throw "Tag $env:REF_NAME does not match VERSION $version" }
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: .\installer\build-installer.ps1 -Version $env:APP_VERSION

      - name: Smoke test installed application
        shell: pwsh
        run: |
          $setup = Resolve-Path ".\dist\AppDeck-Setup-$env:APP_VERSION.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'AppDeck-install'
          $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed: $($install.ExitCode)" }
          $exe = Join-Path $installDir 'AppDeck.exe'
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'installed.flag'))) { throw 'Installed mode marker is missing' }
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Installed self-test failed: $($test.ExitCode)" }
          $report = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'AppDeck\self-test.txt'
          if (-not (Test-Path -LiteralPath $report)) { throw 'Installed app did not use LocalAppData' }
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstall.ExitCode)" }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: AppDeck-Setup-${{ env.APP_VERSION }}
          path: |
            dist/AppDeck-Setup-${{ env.APP_VERSION }}.exe
            dist/AppDeck-Setup-${{ env.APP_VERSION }}.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            ".\dist\AppDeck-Setup-$env:APP_VERSION.exe",
            ".\dist\AppDeck-Setup-$env:APP_VERSION.exe.sha256"
          )
          if (gh release view $env:GITHUB_REF_NAME *> $null) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @files --verify-tag --generate-notes --title "AppDeck $env:APP_VERSION"
          }
